name: Deploy React App to EC2

on:
  push:
    branches:
      - main

# THIS IS THE KEY FIX: Tells the robot to run all commands inside the subfolder
defaults:
  run:
    working-directory: ./my-react-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install  # Changed from 'npm ci' to be more flexible

      - name: Build React App
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Update this source to find the 'dist' folder inside the subfolder
          source: "my-react-app/dist/*"
          target: "/var/www/html/"
          strip_components: 2 # Increased to 2 to strip 'my-react-app' and 'dist'