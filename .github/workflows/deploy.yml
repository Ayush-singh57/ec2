name: Deploy React App to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 1: Install dependencies inside the subfolder
      - name: Install Dependencies
        run: npm install
        working-directory: ./my-react-app

      # Step 2: Build the project where index.html lives
      - name: Build React App
        run: npm run build
        working-directory: ./my-react-app

      # Step 3: Securely copy files to AWS
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # The robot looks from the root, so we point to the dist folde
          source: "my-react-app/dist/*"
          target: "/var/www/html/"
          # strip_components: 2 removes "my-react-app" and "dist" 
          # so files land directly in /var/www/html/
          strip_components: 2